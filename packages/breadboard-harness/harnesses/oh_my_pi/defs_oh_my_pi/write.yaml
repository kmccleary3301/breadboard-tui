id: write
name: write
description: Create a new file from provided content block
type_id: python
parameters:
  - name: filePath
    schema:
      type: string
      description: Path to the new file (OpenCode-compatible)
    required: false
  - name: file_name
    schema:
      type: string
      description: Path to the new file (legacy alias)
    required: false
  - name: content
    schema:
      type: string
      description: Full file content to write
    required: true
execution:
  blocking: true
provider_routing:
  openai:
    native_primary: true
