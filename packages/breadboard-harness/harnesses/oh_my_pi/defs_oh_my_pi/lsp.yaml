id: lsp
name: lsp
description: >-
  Symbol-aware code intelligence from language servers — navigation, refactors,
  and diagnostics where text tools miss callsites.


  <operations>

  - Position-based: `file` + `line` + `symbol` (substring; `#N` for Nth match).
  `line` is 1-indexed.

  - `rename` — applies by default; `apply: false` previews. Project-aware
  lookups ERROR without `symbol` — no silent fallback on missing/ambiguous
  matches.

  - `code_actions` — lists by default; apply ONE with `apply: true` + `query`
  (title substring or index).

  - `rename_file` — moves file AND rewrites all imports/references; applies by
  default.

  - `diagnostics` — path, glob (`src/**/*.ts`), or `file: "*"` for workspace.

  - `symbols` — `file` lists file symbols; `file: "*"` + `query` searches
  workspace.

  - `reload` — restart one server (`file`) or all (`*`); `reload *` re-reads LSP
  config.

  - `request` — raw: `query` = method, `payload` = JSON params (else
  auto-built).

  </operations>


  <critical>

  - Symbol-aware work (rename, references, definition, code actions) MUST use
  `lsp` whenever a server is available.
    It follows shadowing, re-exports, and cross-file usages text tools miss.
  - NEVER do a cross-file rename with `ast_edit`/`sed`/hand edits when `lsp`
  `rename`/`rename_file` can — text renames silently drop callsites.

  - Reach for `code_actions` on imports, quick-fixes, and server-known refactors
  before editing by hand.

  </critical>
type_id: python
parameters:
  - name: action
    schema:
      enum:
        - diagnostics
        - definition
        - references
        - hover
        - symbols
        - rename
        - rename_file
        - code_actions
        - type_definition
        - implementation
        - status
        - reload
        - capabilities
        - request
      type: string
    required: true
  - name: apply
    schema:
      type: boolean
    required: false
  - name: file
    schema:
      type: string
    required: false
  - name: line
    schema:
      type: number
    required: false
  - name: new_name
    schema:
      type: string
    required: false
  - name: payload
    schema:
      type: string
    required: false
  - name: query
    schema:
      type: string
    required: false
  - name: symbol
    schema:
      type: string
    required: false
  - name: timeout
    schema:
      type: number
      minimum: 5
      maximum: 300
      description: Timeout in seconds (default 20; range 5–300).
    required: false
provider_routing:
  openai:
    native_primary: true
    strict: true
