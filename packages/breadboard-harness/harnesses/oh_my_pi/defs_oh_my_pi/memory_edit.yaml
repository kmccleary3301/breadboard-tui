id: memory_edit
name: memory_edit
description: >
  Edit Mnemopi long-term memories by id. Only ids returned by `recall`.


  Operations:

  - `update`: working memory; replace content and/or importance.

  - `forget`: permanently delete working memory.

  - `invalidate`: softly supersede working or episodic memory; optional
  `replacement_id`.


  Fact ids — `recall` results marked `[facts]`: read-only. Inspect with `read
  memory://<id>`; any edit op → `not_editable`.


  Prefer `invalidate` for stale memory whose history may still be useful. Use
  `forget` only for content requiring hard deletion.


  MUST read full memory before `update`. Recall previews clipped: trailing `…`
  marks truncation; `full_length` original size. `update` replaces content
  wholesale → updating a preview deletes its unseen tail. First `read
  memory://<id>`; pass merged content in `content`.
type_id: python
parameters:
  - name: op
    schema:
      enum:
        - update
        - forget
        - invalidate
      type: string
      description: memory edit operation
    required: true
  - name: id
    schema:
      type: string
      description: memory id from recall output
    required: true
  - name: content
    schema:
      type: string
      description: replacement content for update
    required: false
  - name: importance
    schema:
      type: number
      description: replacement importance for update (0–1)
    required: false
  - name: replacement_id
    schema:
      type: string
      description: replacement memory id for invalidate
    required: false
execution:
  blocking: true
provider_routing:
  openai:
    native_primary: true
