id: recall
name: recall
description: >
  Search long-term memory; return raw relevance-ranked matching entries.


  Use proactively before questions about past conversations, user preferences,
  project decisions, or topics where prior context improves accuracy. When in
  doubt, recall first.


  `recall`: specific facts or entries. `reflect`: synthesized answer across many
  memories.


  Results: content preview. Trailing `…`: truncation (`truncated: true`;
  `full_length`: original size). Before any `memory_edit update`, MUST fetch
  full row: `read memory://<id>`.
type_id: python
parameters:
  - name: query
    schema:
      type: string
      description: natural language search query
    required: true
execution:
  blocking: true
provider_routing:
  openai:
    native_primary: true
