id: reflect
name: reflect
description: >
  `reflect`: synthesizes a coherent response from relevant long-term memories;
  unlike `recall`, blends them.


  Use for open-ended questions spanning many stored facts: "What do you know
  about this user?", "Summarize project decisions.", "What are my preferences
  for X?"


  `context` optional; focuses synthesis on a specific angle or sub-topic.
type_id: python
parameters:
  - name: query
    schema:
      type: string
      description: question to answer
    required: true
  - name: context
    schema:
      type: string
      description: optional context
    required: false
provider_routing:
  openai:
    native_primary: true
    strict: true
