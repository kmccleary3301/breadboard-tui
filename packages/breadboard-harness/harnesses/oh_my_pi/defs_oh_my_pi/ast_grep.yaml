id: ast_grep
name: ast_grep
description: >-
  Structural code search via ast-grep. Use when syntax shape matters more than
  text (calls, declarations, language constructs).


  <instruction>

  - Narrow each call to one language. `pat` is ONE AST pattern; separate calls
  for unrelated patterns.

  - Set `lang` when extension inference is ambiguous (for example, `cpp` for
  `.h`); `.cu` and `.cuh` infer as C++.

  - `$NAME` captures one node; `$_` matches without binding; `$$$NAME`
  zero-or-more; `$$$` zero-or-more unbound.
    - Use `$$$NAME`, NOT `$$NAME` (invalid). Names UPPERCASE, whole node — `prefix$VAR` fails.
  - Same metavariable twice → MUST match identical code (`$A == $A` matches `x
  == x`, not `x == y`).

  - Patterns MUST parse as single AST node. Non-standalone → wrap: `class $_ { …
  }`.

  - C++ expression-statement calls need trailing `;`: `ns::doThing($ARG);`,
  `$CALLEE($ARG);`.

  - TS: tolerate annotations — `async function $NAME($$$ARGS): $_ { $$$BODY }`.

  - Declaration forms are distinct — `function foo`, method `foo()`, `const foo
  = () => {}`; search the right form before concluding absence.

  - Loosest existence check: `pat: "executeBash"` with narrow `path`.

  </instruction>


  <critical>

  - AVOID repo-root scans — narrow `path` first.

  - Parse issues = query failure, not absence: fix pattern or tighten `path`
  before concluding "no matches".

  - Broad cross-subsystem exploration → Task tool + scout subagent first.

  </critical>
type_id: python
parameters:
  - name: lang
    schema:
      type: string
      description: language override, e.g. cpp for ambiguous .h files
    required: false
  - name: pat
    schema:
      type: string
      description: ast pattern
    required: true
  - name: path
    schema:
      type: string
      description: file, directory, glob, or internal URL to search; pass several as a
        semicolon-delimited list ("src; tests"). Omitted -> searches the
        workspace root (".")
    required: false
  - name: skip
    schema:
      type: number
      description: matches to skip
    required: false
provider_routing:
  openai:
    native_primary: true
    strict: true
