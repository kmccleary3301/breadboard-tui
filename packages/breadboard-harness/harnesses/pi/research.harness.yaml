schema_version: bb.harness_definition.v1
version: 1
workspace:
  root: .
providers:
  default_model: openai/gpt-5.1-codex-mini
  models:
    - id: openai/gpt-5.1-codex-mini
      adapter: openai_responses
provider_tools:
  use_native: true
  api_variant: responses
  responses_use_developer_role: true
  tool_choice: auto

tools:
  registry:
    paths: [defs_pi]
    include: [read, bash, edit, write, grep, find, ls]
prompts:
  packs:
    base:
      system: prompts/system.md
  tool_prompt_mode: system_compiled_and_persistent_per_turn
modes:
  - name: build
    prompt: '@pack(base).system'
    tools_enabled: [read, bash, edit, write, grep, find, ls]
loop:
  sequence:
    - mode: build
