id: grep
name: grep
description: Search file contents for a pattern. Returns matching lines with file
  paths and line numbers. Respects .gitignore. Output is truncated to 100 matches
  or 50KB (whichever is hit first). Long lines are truncated to 500 chars.
provider_routing:
  openai:
    native_primary: true
parameters:
- name: pattern
  schema:
    type: string
    description: Search pattern (regex or literal string)
  required: true
- name: path
  schema:
    type: string
    description: 'Directory or file to search (default: current directory)'
  required: false
- name: glob
  schema:
    type: string
    description: Filter files by glob pattern, e.g. '*.ts' or '**/*.spec.ts'
  required: false
- name: ignoreCase
  schema:
    type: boolean
    description: 'Case-insensitive search (default: false)'
  required: false
- name: literal
  schema:
    type: boolean
    description: 'Treat pattern as literal string instead of regex (default: false)'
  required: false
- name: context
  schema:
    type: number
    description: 'Number of lines to show before and after each match (default: 0)'
  required: false
- name: limit
  schema:
    type: number
    description: 'Maximum number of matches to return (default: 100)'
  required: false
execution:
  blocking: true
