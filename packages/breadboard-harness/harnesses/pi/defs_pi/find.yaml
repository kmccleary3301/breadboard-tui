id: find
name: find
description: Search for files by glob pattern. Returns matching file paths relative
  to the search directory. Respects .gitignore. Output is truncated to 1000 results
  or 50KB (whichever is hit first).
provider_routing:
  openai:
    native_primary: true
parameters:
- name: pattern
  schema:
    type: string
    description: Glob pattern to match files, e.g. '*.ts', '**/*.json', or 'src/**/*.spec.ts'
  required: true
- name: path
  schema:
    type: string
    description: 'Directory to search in (default: current directory)'
  required: false
- name: limit
  schema:
    type: number
    description: 'Maximum number of results (default: 1000)'
  required: false
execution:
  blocking: true
