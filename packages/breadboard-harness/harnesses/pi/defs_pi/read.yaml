id: read
name: read
description: Read the contents of a file. Supports text files and images (jpg, png,
  gif, webp). Images are sent as attachments. For text files, output is truncated
  to 2000 lines or 50KB (whichever is hit first). Use offset/limit for large files.
  When you need the full file, continue with offset until complete.
provider_routing:
  openai:
    native_primary: true
parameters:
- name: path
  schema:
    type: string
    description: Path to the file to read (relative or absolute)
  required: true
- name: offset
  schema:
    type: number
    description: Line number to start reading from (1-indexed)
  required: false
- name: limit
  schema:
    type: number
    description: Maximum number of lines to read
  required: false
execution:
  blocking: true
