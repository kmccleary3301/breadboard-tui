schema_version: bb.harness_definition.v1
version: 1
workspace:
  root: .
providers:
  default_model: openai/gpt-5.1-codex-mini
  models:
    - id: openai/gpt-5.1-codex-mini
      adapter: openai_responses
tools:
  registry:
    paths: [implementations/tools/defs]
prompts:
  packs:
    base:
      system: prompts/system.md
      plan: prompts/system.md
      builder: prompts/system.md
modes:
  - name: plan
    prompt: '@pack(base).plan'
    tools_enabled: [shell_command, apply_patch, update_plan]
  - name: build
    tools_enabled: [shell_command, apply_patch, update_plan]
loop:
  sequence:
    - mode: build
