schema_version: bb.harness_definition.v1
version: 1
workspace:
  root: .
providers:
  default_model: openai/gpt-5.1-codex-mini
  models:
    - id: openai/gpt-5.1-codex-mini
      adapter: openai_responses
provider_tools:
  use_native: true
  suppress_prompts: true
  api_variant: responses
  responses_use_developer_role: true
  tool_choice: auto
  responses_stateful: false

tools:
  registry:
    paths: [implementations/tools/defs_omo]
    include: [bash, read, glob, grep, list, edit, write, task, webfetch, todowrite, todoread, skill, lsp_hover, lsp_goto_definition, lsp_find_references, lsp_document_symbols, lsp_workspace_symbols, lsp_diagnostics, lsp_servers, lsp_prepare_rename, lsp_rename, lsp_code_actions, lsp_code_action_resolve, ast_grep_search, ast_grep_replace, slashcommand, background_task, background_output, background_cancel, call_omo_agent, look_at, interactive_bash, context7_resolve-library-id, context7_get-library-docs, websearch_exa_web_search_exa, grep_app_searchGitHub]
prompts:
  packs:
    base:
      system: prompts/system.md
      builder: prompts/builder.md
  tool_prompt_mode: none
  environment:
    enabled: true
    format: opencode
    file_limit: 200
modes:
  - name: build
    tools_enabled: [bash, read, glob, grep, list, task, webfetch, todowrite, todoread, skill, lsp_hover, lsp_goto_definition, lsp_find_references, lsp_document_symbols, lsp_workspace_symbols, lsp_diagnostics, lsp_servers, lsp_prepare_rename, lsp_rename, lsp_code_actions, lsp_code_action_resolve, ast_grep_search, ast_grep_replace, slashcommand, background_task, background_output, background_cancel, call_omo_agent, look_at, interactive_bash, context7_resolve-library-id, context7_get-library-docs, websearch_exa_web_search_exa, grep_app_searchGitHub]
loop:
  sequence:
    - mode: build
