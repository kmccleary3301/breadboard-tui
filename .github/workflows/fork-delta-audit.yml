name: Fork delta audit

on:
  pull_request:
  push:
    branches: ["main", "upstream-sync/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-delta-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  BBOMP_CORE_52: packages/coding-agent/test/bbomp-core-52/bbomp-core-52.test.ts
  BBOMP_UPSTREAM_TAG: v18.0.0
  BBOMP_UPSTREAM_COMMIT: 96f42809764f0907f7d6b115eab5710de28941de
  BBOMP_UPSTREAM_TREE: 36ecb17efff14e1120dbf93c7f9fd0769e44626c

jobs:
  product-gate:
    name: Fork delta audit, build, and product smoke
    runs-on: ubuntu-22.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install release native addons
        run: |
          set -euo pipefail
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@18.0.0 dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package"/pi_natives.linux-x64-*.node packages/natives/native/
      - name: Fetch pinned canonical upstream tag
        run: |
          set -euo pipefail
          test "$(jq -r .upstream.tag scripts/p31/upstream-sync-policy.json)" = "$BBOMP_UPSTREAM_TAG"
          test "$(jq -r .upstream.commit scripts/p31/upstream-sync-policy.json)" = "$BBOMP_UPSTREAM_COMMIT"
          test "$(jq -r .upstream.tree scripts/p31/upstream-sync-policy.json)" = "$BBOMP_UPSTREAM_TREE"
          test "$(jq -r .upstream.tag scripts/fork-layer-manifest.json)" = "$BBOMP_UPSTREAM_TAG"
          test "$(jq -r .upstream.commit scripts/fork-layer-manifest.json)" = "$BBOMP_UPSTREAM_COMMIT"
          test "$(jq -r .upstream.tree scripts/fork-layer-manifest.json)" = "$BBOMP_UPSTREAM_TREE"
          git fetch --no-tags https://github.com/can1357/oh-my-pi.git \
            "refs/tags/$BBOMP_UPSTREAM_TAG:refs/tags/$BBOMP_UPSTREAM_TAG"
          test "$(git rev-parse "$BBOMP_UPSTREAM_TAG^{commit}")" = "$BBOMP_UPSTREAM_COMMIT"
          test "$(git rev-parse "$BBOMP_UPSTREAM_TAG^{tree}")" = "$BBOMP_UPSTREAM_TREE"
      - name: Full BBOMP-CORE-52
        run: bun test "$BBOMP_CORE_52"
      - name: Productized fork delta audit
        if: always()
        run: bun scripts/audit-fork-delta.ts --receipt-dir artifacts
      - name: Upload deterministic audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-omp-delta-audit-${{ github.run_id }}
          path: |
            artifacts/fork-delta-audit.json
            artifacts/fork-delta-audit.md
          if-no-files-found: error
      - name: Read pinned backend provenance
        id: backend
        run: echo "commit=$(jq -r .backendCommit packages/coding-agent/breadboard-sdk-provenance.json)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned BreadBoard backend provenance
        uses: actions/checkout@v4
        with:
          repository: kmccleary3301/breadboard
          ref: ${{ steps.backend.outputs.commit }}
          path: breadboard-backend
      - name: Build candidate binary
        env:
          BREADBOARD_P30_BACKEND_ROOT: ${{ github.workspace }}/breadboard-backend
        run: bun run --cwd packages/coding-agent build:bb
      - name: Smoke candidate binary
        run: |
          ./packages/coding-agent/dist/bb --version
          ./packages/coding-agent/dist/bb --help
          ./packages/coding-agent/dist/bb --smoke-test
