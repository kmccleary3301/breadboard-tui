name: Fork delta audit

on:
  pull_request:
  push:
    branches: ["bb-omp-convergence/v17.4.0-aci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify declared fork layers
    runs-on: ubuntu-22.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit delta against pinned upstream
        run: bun scripts/audit-fork-delta.ts
